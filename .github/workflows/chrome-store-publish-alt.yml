name: Publish to Chrome Web Store (Alternative)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          jq --arg version "${{ steps.version.outputs.version }}" '.version = $version' dist/chrome/manifest.json > dist/chrome/manifest.tmp && mv dist/chrome/manifest.tmp dist/chrome/manifest.json

      - name: Create ZIP file
        run: |
          cd dist/chrome
          zip -r ../../text-marker-extension-${{ steps.version.outputs.version }}.zip .
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.version }}
          path: text-marker-extension-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Publish using webstore-upload-cli
        run: |
          npm install -g chrome-webstore-upload-cli
          echo "Client ID: ${{ secrets.CHROME_STORE_CLIENT_ID }}"
          echo "Extension ID: ${{ secrets.CHROME_STORE_EXTENSION_ID }}"
          
          # Test upload first
          chrome-webstore-upload upload \
            --source text-marker-extension-${{ steps.version.outputs.version }}.zip \
            --extension-id ${{ secrets.CHROME_STORE_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_STORE_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_STORE_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_STORE_REFRESH_TOKEN }} \
            --publish-test || echo "Test upload completed"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: text-marker-extension-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
