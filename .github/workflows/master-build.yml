name: Master Build

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            npm ci --only=production
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup virtual display
        run: |
          # Start Xvfb virtual display for headed browser tests
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2  # Give Xvfb time to start
          export DISPLAY=:99
          echo "DISPLAY=:99" >> $GITHUB_ENV
          # Verify Xvfb is running
          xdpyinfo -display :99 >/dev/null 2>&1 || echo "Xvfb display :99 is ready"

      - name: Check code formatting
        run: npx prettier --check "**/*.{ts,js,json,md}"

      - name: Run security audit
        run: |
          AUDIT_OUTPUT=$(npm audit --json 2>&1)
          CRITICAL=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          
          if [ "$CRITICAL" != "0" ] || [ "$HIGH" != "0" ]; then
            echo "Security audit failed - Found $CRITICAL critical and $HIGH high vulnerabilities"
            npm audit --audit-level=high
            exit 1
          fi

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Build extension
        run: npm run build

      - name: Run unit tests
        run: npm test -- __tests__/unit

      - name: Run integration tests
        run: npm test -- __tests__/integration

      - name: Run E2E tests (Chrome and Firefox)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"  # Increase memory for Firefox tests
        run: npm run test:e2e

      - name: Run coverage and generate report
        run: npm run test:coverage -- --coverage --coverageReporters=json-summary --coverageReporters=lcov

      - name: Get coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 90

      - name: Save coverage for future comparisons
        run: |
          cp coverage/coverage-summary.json master-coverage-summary.json

      - name: Upload master coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: master-coverage-summary.json
          retention-days: 90

      - name: Get current version
        id: version
        run: |
          # Use the version from package.json (already updated by PR process)
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Create Chrome ZIP archive
        run: |
          cd dist
          zip -r ../text-marker-chrome-${{ steps.version.outputs.version }}.zip .
          cd ..
          echo "Created text-marker-chrome-${{ steps.version.outputs.version }}.zip"

      - name: Create Firefox ZIP archive
        run: |
          cd dist/firefox
          zip -r ../../text-marker-firefox-${{ steps.version.outputs.version }}.zip .
          cd ../..
          echo "Created text-marker-firefox-${{ steps.version.outputs.version }}.zip"

      - name: Create Firefox XPI package
        run: |
          npm run package:firefox
          # Rename the generated zip to xpi for clarity
          mv text_marker-*.zip text-marker-firefox-${{ steps.version.outputs.version }}.xpi
          echo "Created text-marker-firefox-${{ steps.version.outputs.version }}.xpi"

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          echo "Current version: $CURRENT_VERSION"
          echo "Latest tag version: $LATEST_VERSION"
          
          if [[ "$CURRENT_VERSION" == "$LATEST_VERSION" ]]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "❌ Version unchanged, skipping tag creation"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version changed, creating tag"
          fi

      - name: Generate release notes
        if: steps.version-check.outputs.version_changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_NOTES_FILE="release_notes/${VERSION}.md"
          
          if [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "📝 Using pre-generated release notes from $RELEASE_NOTES_FILE"
            cp "$RELEASE_NOTES_FILE" release-notes.md
          else
            echo "⚠️ No pre-generated release notes found, creating basic release notes"
            cat > release-notes.md << EOF
            # Release v${VERSION}
            
            ## 📝 Changes
            See commit history for detailed changes.
            
            ---
            
            *Release notes were not automatically generated*
            EOF
          fi

      - name: Create Git tag
        if: steps.version-check.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "🏷️ Created tag v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version-check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            text-marker-chrome-${{ steps.version.outputs.version }}.zip
            text-marker-firefox-${{ steps.version.outputs.version }}.zip
            text-marker-firefox-${{ steps.version.outputs.version }}.xpi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store
        if: steps.version-check.outputs.version_changed == 'true'
        continue-on-error: true  # Don't fail the workflow if publishing fails
        run: |
          echo "🔍 Debugging Chrome Web Store API access..."
          echo "Extension ID: ${{ secrets.CHROME_STORE_EXTENSION_ID }}"
          echo "Client ID: ${{ secrets.CHROME_STORE_CLIENT_ID }}"
          
          # Test API access first
          echo "🧪 Testing API access..."
          curl -s -H "Authorization: Bearer $(curl -s -d "client_id=${{ secrets.CHROME_STORE_CLIENT_ID }}&client_secret=${{ secrets.CHROME_STORE_CLIENT_SECRET }}&refresh_token=${{ secrets.CHROME_STORE_REFRESH_TOKEN }}&grant_type=refresh_token" https://oauth2.googleapis.com/token | jq -r '.access_token')" "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_STORE_EXTENSION_ID }}" || echo "❌ API test failed"
          
          # Try publishing with detailed error handling
          echo "📤 Attempting to publish..."
          npx chrome-webstore-upload-cli@latest upload \
            --source text-marker-chrome-${{ steps.version.outputs.version }}.zip \
            --extension-id ${{ secrets.CHROME_STORE_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_STORE_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_STORE_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_STORE_REFRESH_TOKEN }} \
            --publish || echo "❌ Publishing failed - see logs above"
          
          echo "📋 If publishing failed, check:"
          echo "1. Chrome Web Store API is enabled in Google Cloud Console"
          echo "2. Extension is published (not just testing)"
          echo "3. Google developer verification is complete"

      - name: Upload Chrome dist folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-dist-v${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90

      - name: Upload Firefox dist folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-dist-v${{ steps.version.outputs.version }}
          path: dist/firefox/
          retention-days: 90
