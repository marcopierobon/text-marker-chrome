name: PR Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, master]
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'version-bump')
    
    steps:
      - name: Debug PR information
        run: |
          echo "🔍 Debugging PR information..."
          echo "Event name: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "PR state: ${{ github.event.pull_request.state }}"
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"
          echo "All labels:"
          echo "${{ github.event.pull_request.labels.*.name }}" | tr ' ' '\n'
          echo "Has version-bump label: ${{ contains(github.event.pull_request.labels.*.name, 'version-bump') }}"
          echo "Has minor label: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Get full history for proper version comparison
          fetch-tags: true  # Fetch all tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version bump type
        id: version-type
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          echo "All labels: $LABELS"
          
          if [[ "$LABELS" == *"major"* ]] || [[ "$LABELS" == *"version-bump: major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$LABELS" == *"minor"* ]] || [[ "$LABELS" == *"version-bump: minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"
          
          TYPE="${{ steps.version-type.outputs.type }}"
          echo "Bump type: $TYPE"
          
          # Parse current version
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case $TYPE in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Extract commits for release notes
        id: release-notes
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          echo "Calling extract-release-notes script for version $NEW_VERSION"
          
          # Call the shell script to extract commits and generate release notes
          ./scripts/extract-release-notes.sh "$NEW_VERSION" > release-notes-output.txt 2>&1 || {
            echo "❌ Script execution failed"
            cat release-notes-output.txt
            exit 1
          }
          
          # Parse the output to extract release notes content
          if grep -q "release_notes=" release-notes-output.txt; then
            RELEASE_NOTES=$(grep "release_notes=" release-notes-output.txt | cut -d'=' -f2-)
            echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT
            echo "✅ Release notes extracted successfully"
          else
            echo "release_notes=No changes in this release" >> $GITHUB_OUTPUT
            echo "ℹ️ No release notes content found"
          fi

      - name: Update or create release notes file
        id: release-notes-file
        run: |
          echo "🔍 Starting release notes file management..."
          
          # Get current version from manifest
          CURRENT_VERSION=$(jq -r '.version' manifest.json)
          echo "Current version from manifest: $CURRENT_VERSION"
          
          # Get release notes from previous step
          REL_NOTES="${{ steps.release-notes.outputs.release_notes }}"
          echo "Release notes extracted: $REL_NOTES"
          
          RELEASE_NOTES_FILE="release_notes/${CURRENT_VERSION}.md"
          echo "Target release notes file: $RELEASE_NOTES_FILE"
          
          # Check if file exists in master (not in current branch)
          if git diff --name-only origin/master -- | grep -q "^${RELEASE_NOTES_FILE}$"; then
            echo "📝 File $RELEASE_NOTES_FILE was added in this branch - updating content"
            UPDATE_FILE=true
          elif [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "📝 File $RELEASE_NOTES_FILE exists in master - updating content"
            UPDATE_FILE=true
          else
            echo "📝 File $RELEASE_NOTES_FILE does not exist - creating new file"
            UPDATE_FILE=false
          fi
          
          # Create or update the release notes file
          {
            echo "# Release v${CURRENT_VERSION}"
            echo "## 📝 Changes"
            echo "$REL_NOTES"
            echo ""
            echo "---"
            echo "*This release was automatically generated from PR #${{ github.event.pull_request.number }}*"
            if [ "$UPDATE_FILE" = "true" ]; then
              echo "*Release notes updated with new commits*"
            fi
          } > "$RELEASE_NOTES_FILE"
          
          echo "✅ Release notes file $RELEASE_NOTES_FILE created/updated"
          
          # Check if this version was already bumped (file exists in master)
          if git show origin/master:"$RELEASE_NOTES_FILE" >/dev/null 2>&1; then
            echo "📝 Release notes file exists in master - version already bumped"
            echo "version_already_bumped=true" >> $GITHUB_OUTPUT
          elif git diff --name-only origin/master -- | grep -q "^${RELEASE_NOTES_FILE}$"; then
            echo "📝 Release notes file was added in this PR branch - version already bumped"
            echo "version_already_bumped=true" >> $GITHUB_OUTPUT
          else
            echo "📝 Release notes file does not exist in master - new version"
            echo "version_already_bumped=false" >> $GITHUB_OUTPUT
          fi
          
          echo "🔍 Release notes file management completed"

      - name: Update version files
        if: steps.release-notes-file.outputs.version_already_bumped != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          
          # Update package.json
          jq --arg version "$NEW_VERSION" '.version = $version' package.json > package.tmp && mv package.tmp package.json
          
          # Update Chrome manifest
          jq --arg version "$NEW_VERSION" '.version = $version' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          
          # Update Firefox manifest
          jq --arg version "$NEW_VERSION" '.version = $version' manifest.firefox.json > manifest.firefox.tmp && mv manifest.firefox.tmp manifest.firefox.json
          
          echo "✅ Updated all version files to $NEW_VERSION"

      - name: Run tests
        if: steps.release-notes-file.outputs.version_already_bumped != 'true'
        run: npm test

      - name: Commit version bump and release notes
        if: steps.release-notes-file.outputs.version_already_bumped != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet package.json manifest.json manifest.firefox.json; then
            echo "❌ No version changes detected"
            exit 1
          fi
          
          # Add version files and release notes
          git add package.json manifest.json manifest.firefox.json
          
          # Add release notes if they exist
          if [ -d "release_notes" ]; then
            git add release_notes/
            echo "📝 Added release notes"
          fi
          
          git commit -m "chore: bump version to $NEW_VERSION"
          
          # Push to the PR branch
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "✅ Version bump and release notes committed and pushed to PR branch"

      - name: Commit updated release notes
        if: steps.release-notes-file.outputs.version_already_bumped == 'true'
        run: |
          CURRENT_VERSION=$(jq -r '.version' manifest.json)
          RELEASE_NOTES_FILE="release_notes/${CURRENT_VERSION}.md"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add and commit updated release notes
          git add "$RELEASE_NOTES_FILE"
          git commit -m "docs: update release notes for v${CURRENT_VERSION} with new commits"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          
          echo "✅ Updated release notes committed and pushed"

      - name: Comment on PR when version already bumped
        if: steps.release-notes-file.outputs.version_already_bumped == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const currentVersion = '${{ steps.release-notes-file.outputs.CURRENT_VERSION }}';
            const bumpType = '${{ steps.version-type.outputs.type }}';
            
            const message = `## 🔄 Release Notes Updated
            
            **Current Version**: ${currentVersion}
            **Bump Type**: ${bumpType}
            
            The version files already contain version ${currentVersion}, so no version bump was performed.
            However, the release notes have been updated with new commits from this PR.
            
            This happens when:
            - The version was already bumped in a previous commit to this PR
            - New commits were added after the version bump
            
            The PR is ready for review and merge. Once merged, the master workflow will:
            - Create a Git tag (v${currentVersion})
            - Create a GitHub release with the updated release notes
            - Publish to Chrome Web Store
            
            ---
            
            *Release notes updated because version ${currentVersion} is already applied.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Comment on PR
        if: success() && steps.release-notes-file.outputs.version_already_bumped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.version.outputs.version }}';
            const bumpType = '${{ steps.version-type.outputs.type }}';
            const releaseNotes = `${{ steps.release-notes.outputs.release_notes }}`;

            const message = `## 🔄 Version Bumped

            **New Version**: ${newVersion}
            **Bump Type**: ${bumpType}

            ${releaseNotes}

            Version files and release notes have been updated and committed to this PR. This PR is now ready for review and merge.

            Once merged, the master workflow will automatically:
            - Create a Git tag (v${newVersion})
            - Create a GitHub release with these release notes
            - Publish to Chrome Web Store

            ---

            *This version bump was triggered by the \`version-bump\` label.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Comment on PR when commit fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## ❌ Version Bump Failed
            
            The version bump process failed. Please check the workflow logs for details.
            
            Possible issues:
            - No version changes detected
            - Git push permissions
            - Test failures
            
            Please fix the issues and re-add the \`version-bump\` label to retry.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
