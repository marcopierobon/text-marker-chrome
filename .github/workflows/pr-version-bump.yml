name: PR Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, master]
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'version-bump')
    
    steps:
      - name: Debug PR information
        run: |
          echo "🔍 Debugging PR information..."
          echo "Event name: ${{ github.event_name }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "PR state: ${{ github.event.pull_request.state }}"
          echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head branch: ${{ github.event.pull_request.head.ref }}"
          echo "All labels:"
          echo "${{ github.event.pull_request.labels.*.name }}" | tr ' ' '\n'
          echo "Has version-bump label: ${{ contains(github.event.pull_request.labels.*.name, 'version-bump') }}"
          echo "Has minor label: ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Get full history for proper version comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version bump type
        id: version-type
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          echo "All labels: $LABELS"
          
          if [[ "$LABELS" == *"major"* ]] || [[ "$LABELS" == *"version-bump: major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$LABELS" == *"minor"* ]] || [[ "$LABELS" == *"version-bump: minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"
          
          TYPE="${{ steps.version-type.outputs.type }}"
          echo "Bump type: $TYPE"
          
          # Parse current version
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case $TYPE in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Extract commits for release notes
        id: release-notes
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          echo "Extracting commits for version $NEW_VERSION"
          
          # Get all commits that are in PR but not in master
          COMMITS=$(git log --oneline --no-merges origin/master..HEAD)
          
          if [ -z "$COMMITS" ]; then
            echo "No new commits found"
            echo "release_notes=No changes in this release" >> $GITHUB_OUTPUT
          else
            echo "Found commits:"
            echo "$COMMITS"
            
            # Create release notes directory
            mkdir -p release_notes
            
            # Generate release notes content with proper here-document syntax
            cat > "release_notes/${NEW_VERSION}.md" << EOF
            # Release v${NEW_VERSION}
            
            ## 📝 Changes
            
            $COMMITS
            
            ---
            
            *This release was automatically generated from PR #${{ github.event.pull_request.number }}*
            EOF
            
            echo "✅ Created release_notes/${NEW_VERSION}.md"
            
            # Set output for comment
            RELEASE_NOTES_CONTENT="## 📝 Changes
            
            $(echo "$COMMITS" | sed 's/^/- /')"
            
            echo "release_notes=$RELEASE_NOTES_CONTENT" >> $GITHUB_OUTPUT
          fi

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          
          # Update package.json
          jq --arg version "$NEW_VERSION" '.version = $version' package.json > package.tmp && mv package.tmp package.json
          
          # Update Chrome manifest
          jq --arg version "$NEW_VERSION" '.version = $version' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          
          # Update Firefox manifest
          jq --arg version "$NEW_VERSION" '.version = $version' manifest.firefox.json > manifest.firefox.tmp && mv manifest.firefox.tmp manifest.firefox.json
          
          echo "✅ Updated all version files to $NEW_VERSION"

      - name: Run tests
        run: npm test

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet package.json manifest.json manifest.firefox.json; then
            echo "❌ No version changes detected"
            exit 1
          fi
          
          # Add version files and release notes
          git add package.json manifest.json manifest.firefox.json
          
          # Add release notes if they exist
          if [ -d "release_notes" ]; then
            git add release_notes/
            echo "📝 Added release notes"
          fi
          
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          
          # Push to the PR branch
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "✅ Version bump and release notes committed and pushed to PR branch"

      - name: Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.version.outputs.version }}';
            const bumpType = '${{ steps.version-type.outputs.type }}';
            const releaseNotes = `${{ steps.release-notes.outputs.release_notes }}`;
            
            const message = `## 🔄 Version Bumped
            
            **New Version**: ${newVersion}
            **Bump Type**: ${bumpType}
            
            ${releaseNotes}
            
            Version files and release notes have been updated and committed to this PR. This PR is now ready for review and merge.
            
            Once merged, the master workflow will automatically:
            - Create a Git tag (v${newVersion})
            - Create a GitHub release with these release notes
            - Publish to Chrome Web Store
            
            ---
            
            *This version bump was triggered by the \`version-bump\` label.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Comment on PR when commit fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## ❌ Version Bump Failed
            
            The version bump process failed. Please check the workflow logs for details.
            
            Possible issues:
            - No version changes detected
            - Git push permissions
            - Test failures
            
            Please fix the issues and re-add the \`version-bump\` label to retry.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
