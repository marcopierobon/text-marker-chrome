name: Mutation Testing

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            npm ci --only=production
          fi

      - name: Run mutation tests
        id: mutation
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "🧬 Running differential mutation testing on PR changes..."
            
            # Get changed files
            git diff --name-only origin/master...HEAD > changed_files.txt
            echo "Changed files:"
            cat changed_files.txt
            
            # Run mutation testing only on changed files
            npm run test:mutation:incremental -- --reporters=json > mutation-report.json || true
            MUTATION_SCORE=$(jq -r '.mutationScore' mutation-report.json 2>/dev/null || echo "0")
            echo "PR Mutation Score (incremental): $MUTATION_SCORE%"
          else
            echo "🧬 Running full mutation testing on master..."
            
            # Run full mutation testing on master
            npm run test:mutation -- --reporters=json > mutation-report.json || true
            MUTATION_SCORE=$(jq -r '.mutationScore' mutation-report.json 2>/dev/null || echo "0")
            echo "Master Mutation Score (full): $MUTATION_SCORE%"
          fi
          
          echo "mutation_score=$MUTATION_SCORE" >> $GITHUB_OUTPUT

      - name: Download master mutation score
        id: master-mutation
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Try to get the latest master mutation score from artifacts
          gh run list --branch master --workflow "Mutation Testing" --limit 1 --json databaseId --jq '.[0].databaseId' > run_id.txt || echo "0" > run_id.txt
          RUN_ID=$(cat run_id.txt)
          
          if [ "$RUN_ID" != "0" ]; then
            gh run download $RUN_ID -n mutation-baseline || echo "No mutation artifact found"
            if [ -f master-mutation-score.json ]; then
              MASTER_SCORE=$(jq -r '.mutationScore' master-mutation-score.json)
              echo "master_mutation_score=$MASTER_SCORE" >> $GITHUB_OUTPUT
              echo "Master Mutation Score: $MASTER_SCORE%"
            else
              echo "master_mutation_score=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "master_mutation_score=0" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compare mutation scores
        if: github.event_name == 'pull_request' && steps.master-mutation.outputs.master_mutation_score != '0'
        run: |
          PR_SCORE=${{ steps.mutation.outputs.mutation_score }}
          MASTER_SCORE=${{ steps.master-mutation.outputs.master_mutation_score }}
          
          echo "PR Mutation Score (incremental): $PR_SCORE%"
          echo "Master Mutation Score (full): $MASTER_SCORE%"
          
          # For incremental tests, we just check that it's not zero (indicating setup works)
          if [ "$PR_SCORE" != "0" ]; then
            echo "✅ Incremental mutation testing completed successfully"
          else
            echo "⚠️ Incremental mutation testing had issues, but this may be expected for small changes"
          fi

      - name: Save mutation score for master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo '{"mutationScore": ${{ steps.mutation.outputs.mutation_score }}}' > master-mutation-score.json

      - name: Upload mutation baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-baseline
          path: master-mutation-score.json
          retention-days: 90

      - name: Comment PR with mutation score
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const prScore = '${{ steps.mutation.outputs.mutation_score }}';
            const masterScore = '${{ steps.master-mutation.outputs.master_mutation_score }}';
            
            let message = `## 🧬 Mutation Testing Report\n\n`;
            
            if (prScore !== '0') {
              message += `- **PR Mutation Score (incremental):** ${prScore}%\n`;
              message += `📝 *Only testing changed files - full test runs on master*\n`;
            } else {
              message += `⚠️ Incremental mutation testing completed\n`;
              message += `📝 *No mutants found in changed files or testing setup issue*\n`;
            }
            
            if (masterScore !== '0') {
              message += `- **Master Mutation Score (full):** ${masterScore}%\n`;
              message += `📝 *Full codebase mutation score from latest master*\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
